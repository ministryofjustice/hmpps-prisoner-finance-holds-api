hmpps-auth:
  url: "http://localhost:8090/auth"

spring:
  application:
    name: hmpps-prisoner-finance-holds-api

  datasource:
    url: 'jdbc:postgresql://${DB_SERVER:localhost:5436}/${DB_NAME:holds}?sslmode=prefer'
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

general-ledger-api:
  url: ${GENERAL_LEDGER_API_URL:http://localhost:8084}

holds-api:
  client:
    id: ${HOLDS_API_CLIENT_ID:hmpps-prisoner-finance-holds-api-1}
    secret: ${HOLDS_API_CLIENT_SECRET:clientsecret}

hmpps:
  sqs:
    provider: localstack
    queues:
      domainevents:
        queueName: prisoner-finance-event-queue
        dlqName: prisoner-finance-event-dlq
        subscribeTopicId: domainevents
        subscribeFilter: '{"eventType":[ "prison-offender-events.prisoner.merged"] }'
    topics:
      domainevents:
        arn: arn:aws:sns:eu-west-2:000000000000:11111111-2222-3333-4444-555555555555