server:
  shutdown: immediate

management.endpoint:
  health.cache.time-to-live: 0
  info.cache.time-to-live: 0

spring:
  jpa:
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:/db/migrations/common

hmpps-auth:
  url: "http://localhost:8090/auth"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

general-ledger-api:
  url: http://localhost:8091


hmpps.sqs:
  provider: localstack
  queues:
    verify_hold_transactions:
      queueName: "verify_hold_transactions"
      dlqName: "verify_hold_transactions-dlq"
      visibilityTimeout: 600
