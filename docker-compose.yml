services:
  hmpps-prisoner-finance-holds-api:
    image: ghcr.io/ministryofjustice/hmpps-prisoner-finance-holds-api:latest
    networks:
      - hmpps
    container_name: hmpps-prisoner-finance-holds-api
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
    environment:
      - SERVER_PORT=8080
      - HMPPS_AUTH_URL=http://hmpps-auth:8080/auth
      - SPRING_PROFILES_ACTIVE=dev

  hmpps-prisoner-finance-holds-db:
    container_name: hmpps-prisoner-finance-holds-db
    image: postgres:16
    restart: always
    networks:
      - hmpps
    ports:
      - "5436:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=holds
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5


  hmpps-auth:
    image: ghcr.io/ministryofjustice/hmpps-auth:latest
    networks:
      - hmpps
    container_name: hmpps-auth
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=dev
      - APPLICATION_AUTHENTICATION_UI_ALLOWLIST=0.0.0.0/0

  hmpps-prisoner-finance-general-ledger-api:
    image: ghcr.io/ministryofjustice/hmpps-prisoner-finance-general-ledger-api:latest
    networks:
      - hmpps
    container_name: hmpps-prisoner-finance-general-ledger-api
    ports:
      - "8084:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health/ping" ]
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=dev
      - HMPPS_AUTH_URL=http://hmpps-auth:8080/auth
      - DB_SERVER=hmpps-prisoner-finance-general-ledger-db
      - DB_NAME=general_ledger
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_PORT=5435
      - CALC_BALANCE_QUEUE_NAME=calculated_balance_queue.fifo
      - CALC_BALANCE_DLQ_NAME=calculated_balance_queue_dlq.fifo
      - SQS_PROVIDER=localstack
      - SQS_LOCALSTACK_URL=http://localstack:4566
    depends_on:
      hmpps-auth:
        condition: service_started
      hmpps-prisoner-finance-general-ledger-db:
        condition: service_healthy
        restart: true

  hmpps-prisoner-finance-general-ledger-db:
    container_name: hmpps-prisoner-finance-general-ledger-db
    image: postgres:16
    restart: always
    networks:
      - hmpps
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=general_ledger
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:4
    networks:
      - hmpps
    container_name: localstack
    ports:
      - "4566:4566"
      - 8999:8080
    environment:
      - SERVICES=sqs
      - DEFAULT_REGION=eu-west-2
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"

networks:
  hmpps:
